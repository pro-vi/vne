[package]
name = "vne"
version = "0.1.0"
license = "MIT"
description = "A local private .env viewer and editor"
authors = ["vne contributors"]
edition = "2021"
rust-version = "1.90"
default-run = "vne"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "vne_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
base64 = "0.22.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-webdriver = "0.2"
xattr = "1"
tempfile = "3.27.0"

[dev-dependencies]

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSString"] }
