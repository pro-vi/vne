[package]
name = "vne"
version = "0.1.0"
description = "A local private .env viewer and editor"
authors = ["vne contributors"]
edition = "2021"
rust-version = "1.82"
default-run = "vne"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "vne_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
base64 = "0.22.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2.7.1"
xattr = "1"
tempfile = "3.27.0"

[dev-dependencies]
